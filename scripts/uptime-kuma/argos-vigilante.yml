# Vigilante externo (dead man's switch) de ArgOS. Gratis, sin cuentas nuevas.
# ArgOS publica un latido cada 10 min en un tema ntfy privado (argos-latido.timer).
# Cada 15 min este workflow revisa los latidos de las últimas 12 h (caché de ntfy.sh):
#  - último latido entre 40 y 55 min atrás  -> alerta "ArgOS no da señales" (una vez)
#  - último latido entre 6 h y 6 h 15 atrás -> recordatorio (una vez)
#  - latido reciente tras un hueco > 40 min  -> "ArgOS volvió"
# Los temas están en Secrets del repo (NTFY_TOPIC, LATIDO_TOPIC); nunca se imprimen.
name: argos-vigilante
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
permissions: {}
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Revisar latidos
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LATIDO_TOPIC: ${{ secrets.LATIDO_TOPIC }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          lat, ale = os.environ["LATIDO_TOPIC"], os.environ["NTFY_TOPIC"]
          raw = urllib.request.urlopen(f"https://ntfy.sh/{lat}/json?poll=1&since=12h", timeout=30).read().decode()
          ts = sorted(json.loads(l)["time"] for l in raw.splitlines() if l.strip() and json.loads(l).get("event") == "message")
          now = time.time()
          def send(title, msg, prio, tags):
              req = urllib.request.Request(f"https://ntfy.sh/{ale}", data=msg.encode(), headers={"Title": title, "Priority": prio, "Tags": tags})
              urllib.request.urlopen(req, timeout=30); print("aviso enviado:", title)
          if not ts:
              print("sin latidos en 12 h (ya se avisó antes)"); raise SystemExit
          edad = (now - ts[-1]) / 60
          print(f"último latido hace {edad:.0f} min")
          if 40 <= edad < 55:
              send("ArgOS no da señales", f"Sin latido hace {edad:.0f} min: apagado, sin luz o sin internet.", "urgent", "rotating_light")
          elif 360 <= edad < 375:
              send("ArgOS sigue sin señales", "Van 6 h sin latido.", "high", "warning")
          elif edad < 15 and len(ts) >= 2 and (ts[-1] - ts[-2]) / 60 > 40:
              send("ArgOS volvió", f"Latidos de nuevo tras {(ts[-1]-ts[-2])/60:.0f} min sin señal.", "default", "white_check_mark")
          PY
