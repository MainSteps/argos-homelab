# Uptime Kuma para ArgOS. Panel solo en LAN (<IP_LAN>) y Tailscale (<IP_TAILSCALE>), nunca 0.0.0.0.
name: argos-kuma
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.6
    container_name: argos-kuma
    restart: unless-stopped
    environment:
      TZ: America/Santiago
      UPTIME_KUMA_DISABLE_FRAME_SAMEORIGIN: "0"
    ports:
      - "<IP_LAN>:3001:3001"
      - "<IP_TAILSCALE>:3001:3001"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
